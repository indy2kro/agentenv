name: Publish

# Publish @indy2kro/agentenv to npm whenever a version tag (v*) is pushed.
# Auth: npm Trusted Publishing via OIDC (no token). This workflow must be registered
# as the Trusted Publisher for the package in npm package settings (see
# docs/guides/releasing.md). The tag must match package.json version exactly: `v<version>`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # for npm provenance (attestation), requires the tag to be a git commit

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @indy2kro/agentenv to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cmd/agentenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so npm can resolve the tag commit for provenance
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/agentenv/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Upgrade npm
        run: npm install -g npm@latest # trusted publishing/OIDC requires npm >= 11.5.1
      - name: Verify tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match package.json version '${version}'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Gate (build, lint, format, test, smoke, clean tree)
        run: |
          npm run build
          npm run lint
          npm run format:check
          npm test
          npm run smoke
          git diff --exit-code
      - name: Inspect package contents
        run: |
          npm pack --dry-run > /tmp/pack.log 2>&1
          cat /tmp/pack.log
          grep -q "dist/index.js" /tmp/pack.log || { echo "dist/index.js missing from package" >&2; exit 1; }
          grep -q "README.md" /tmp/pack.log || { echo "README.md missing from package" >&2; exit 1; }
          grep -q "LICENSE" /tmp/pack.log || { echo "LICENSE missing from package" >&2; exit 1; }
          if grep -Eq "\.test\.(js|mjs|cjs)" /tmp/pack.log; then
            echo "test files leaked into package" >&2
            exit 1
          fi
      - name: Determine npm dist-tag
        run: |
          case "$version" in
            *-*) echo "tag=beta" ;;
            *)   echo "tag=latest" ;;
          esac >> "$GITHUB_ENV"
      - name: Publish to npm
        # No NODE_AUTH_TOKEN here: npm must use the OIDC trusted-publishing path.
        # A token env var makes npm fall back to the legacy token flow (EOTP).
        run: npm publish --provenance --access public --tag "$tag"