name: Debug mise layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Inspect
        run: |
          set -x
          mise --version
          echo "real HOME=$HOME"
          export HOME=/tmp/dbg-home
          mkdir -p "$HOME" "$HOME/proj"
          printf 'scope = "project"\n\n[agents]\nclaude_code = true\ncodex_cli = true\ncopilot = true\nopencode = true\n\n[tools]\nripgrep = true\nfd = true\njq = true\nrtk = true\n\n[rtk]\nenabled = true\n\n[tier0]\ncheck_enabled = true\n' > "$HOME/proj/agentenv.toml"
          cd "$HOME/proj"
          printf 'scope = "project"\n\n[agents]\nclaude_code = true\ncodex_cli = true\ncopilot = true\nopencode = true\n\n[tools]\nripgrep = "latest"\nfd = "latest"\njq = "latest"\nrtk = "0.49.0"\n\n[rtk]\nenabled = true\n\n[tier0]\ncheck_enabled = true\n' > .mise.toml
          echo "== mise env =="
          mise env || true
          echo "== install =="
          mise install || true
          echo "== shims dir =="
          ls -la "$HOME/.local/share/mise/shims" 2>&1 | head -20 || true
          echo "== installs dir =="
          find "$HOME/.local/share/mise/installs" -maxdepth 3 -name rtk 2>/dev/null || true
          echo "== which rtk (no prepend) =="
          which rtk || true
          echo "== which rtk (shims prepended) =="
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          which rtk || true
          rtk --version 2>&1 | head -3 || true
          echo "== mise env vars =="
          env | rg -i "^(MISE|XDG)" || true