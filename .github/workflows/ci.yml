name: CI

on:
  # Only main on push: a push to a PR branch also fires pull_request, and the
  # two events have different refs, so the concurrency group below never
  # cancelled one for the other and every commit ran the whole matrix twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-repo:
    name: 'Lint repo (actionlint, shellcheck, gitleaks)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install actionlint, shellcheck, gitleaks
        run: mise use -g actionlint@1.7.12 shellcheck@0.11.0 gitleaks@8.30.1
      - name: actionlint (also shellchecks embedded `run:` scripts)
        run: actionlint
      - name: gitleaks
        run: gitleaks detect --source . --no-banner

  build-test:
    name: 'Build & Test (${{ matrix.os }}, node ${{ matrix.node-version }})'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd/agentenv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cmd/agentenv/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      # One matrix combination only: coverage is OS/Node-version-invariant in
      # practice, and gating every combination would just multiply CI time
      # for the same signal.
      - name: Test coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm run test:coverage
      - name: Per-file coverage floors
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm run test:coverage:files
      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm audit --omit=dev
      - name: Smoke (full CLI pipeline, stub rtk)
        run: npm run smoke
      - name: Verify CLI surface (version/help/completion)
        shell: bash
        run: |
          version=$(node dist/index.js --version)
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg_version" ]; then
            echo "CLI version '$version' does not match package.json '$pkg_version'"
            exit 1
          fi
          node dist/index.js --help >/dev/null
          for cmd in setup apply status update doctor uninstall completion shell-fix; do
            if ! node dist/index.js "$cmd" --help >/dev/null 2>&1; then
              echo "--help failed for '$cmd'"
              exit 1
            fi
          done
          for shell in bash zsh fish powershell; do
            if ! node dist/index.js completion "$shell" >/dev/null 2>&1; then
              echo "completion '$shell' failed"
              exit 1
            fi
          done
          for cmd in setup apply status update doctor uninstall completion shell-fix; do
            if ! node dist/index.js completion bash | grep -Eq "^[[:space:]]*${cmd}\)"; then
              echo "bash completion is missing '$cmd'"
              exit 1
            fi
          done

  # What users actually receive: the packed tarball, installed into a clean
  # directory, not the in-tree dist/ the build-test job runs.
  pack-smoke:
    name: 'Packed tarball smoke (ubuntu, node 24)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/agentenv/package-lock.json
      - name: Pack
        working-directory: cmd/agentenv
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the tarball into a clean directory and run it
        run: |
          mkdir "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/*.tgz
          bin="$RUNNER_TEMP/consumer/node_modules/.bin/agentenv"
          "$bin" --version
          cd "$RUNNER_TEMP/project"
          printf 'scope = "project"\n[agents]\nclaude_code = true\n' > agentenv.toml
          "$bin" apply --dry-run --json | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); if (d.success !== true || d.dryRun !== true) { console.error(d); process.exit(1); }'

  acceptance:
    name: 'Acceptance: full setup (${{ matrix.os }})'
    needs: build-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/agentenv/package-lock.json
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install node deps + build CLI
        working-directory: cmd/agentenv
        run: npm ci && npm run build
      - name: Assert toolchain (mise + node + git callable)
        shell: bash
        run: |
          mise --version
          node --version
          git --version
          bash --version | head -n 1
      - name: 'Acceptance sweep — real apply/status/setup for all 9 agents, full catalog install + execution verify + command sweep'
        working-directory: cmd/agentenv
        run: npm run smoke:real