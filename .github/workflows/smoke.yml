name: Smoke (full setup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-setup:
    name: 'Full setup (${{ matrix.os }})'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cmd/agentenv/package-lock.json
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install node deps + build CLI
        working-directory: cmd/agentenv
        run: npm ci && npm run build
      - name: Real apply + status (mise installs pinned tools, rtk writes hooks)
        working-directory: cmd/agentenv
        run: npm run smoke:real